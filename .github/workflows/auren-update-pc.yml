# Manual-only control plane. Dispatch THIS workflow on ci/remote-update-control.
# The local before-job hook must pin its reviewed commit and reject other refs.
name: Auren - controle remoto do PC
on:
  workflow_dispatch:
    inputs:
      operacao:
        description: 'O que fazer no PC'
        type: choice
        required: true
        default: testar_pr
        options: [testar_pr, atualizar_main]
      numero_pr:
        description: 'Numero da PR; usado somente em testar_pr'
        type: string
        required: false
      camada:
        description: 'Teste da PR: pytest (padrao) ou live; live causa efeitos no PC'
        type: choice
        required: true
        default: pytest
        options: [pytest, L0, L1, L2, L4, L5, ALL]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: auren-remote-control
  cancel-in-progress: false
jobs:
  validar:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/ci/remote-update-control' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pr_sha: ${{ steps.resolver.outputs.pr_sha }}
      pr_number: ${{ steps.resolver.outputs.pr_number }}
    steps:
      - name: Conferir pedido e identificar commit da PR
        id: resolver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          OPERATION: ${{ inputs.operacao }}
          PR_NUMBER: ${{ inputs.numero_pr }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen

          action = os.environ["OPERATION"]
          number = os.environ["PR_NUMBER"].strip()
          if action == "atualizar_main":
              if number:
                  raise SystemExit("Para atualizar a main, nao preencha numero_pr.")
              print("Atualizacao manual da main autorizada.")
          elif action == "testar_pr":
              if not re.fullmatch(r"[1-9][0-9]{0,5}", number):
                  raise SystemExit("Informe um numero de PR valido.")
              url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/pulls/{number}"
              req = Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urlopen(req, timeout=20) as response:
                  info = json.load(response)
              if info.get("state") != "open" or info.get("draft"):
                  raise SystemExit("A PR precisa estar aberta e nao pode ser draft.")
              if info.get("base", {}).get("ref") != "main":
                  raise SystemExit("A PR nao aponta para main.")
              head = info.get("head", {})
              if (head.get("repo") or {}).get("full_name") != os.environ["REPOSITORY"]:
                  raise SystemExit("PR de fork nao pode executar no PC pessoal.")
              sha = head.get("sha", "")
              if not re.fullmatch(r"[a-f0-9]{40}", sha):
                  raise SystemExit("Commit da PR invalido.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"pr_sha={sha}\npr_number={number}\n")
              print(f"PR #{number}, commit aprovado para este pedido: {sha}")
          else:
              raise SystemExit("Operacao desconhecida.")
          PY
  executar:
    needs: validar
    runs-on: [self-hosted, Windows, X64, auren-isolated]
    environment: auren-windows
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - name: Obter somente codigo de controle revisado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          clean: true
          persist-credentials: false
      - name: Baixar PR pelo SHA resolvido, em pasta separada
        if: ${{ inputs.operacao == 'testar_pr' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validar.outputs.pr_sha }}
          path: pr-checkout
          clean: true
          persist-credentials: false
      - name: Atualizar somente a main instalada no Windows
        if: ${{ inputs.operacao == 'atualizar_main' }}
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'never'
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = $env:GITHUB_STEP_SUMMARY
          try {
            $config = Join-Path $env:USERPROFILE 'auren-remote\policy\checkout-path.txt'
            if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
              throw 'Caminho da instalacao principal ainda nao configurado no PC.'
            }
            $folder = (Get-Content -LiteralPath $config -Raw).Trim()
            if (-not $folder -or -not [System.IO.Path]::IsPathRooted($folder) -or
                -not (Test-Path -LiteralPath (Join-Path $folder '.git'))) {
              throw 'Pasta Git principal invalida.'
            }
            $branch = (& git.exe -C $folder branch --show-current | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $branch -ne 'main') { throw 'Checkout principal nao esta na main.' }
            $origin = (& git.exe -C $folder remote get-url origin | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $origin -notmatch '^(?:https://github\.com/|git@github\.com:|ssh://git@github\.com/)Yamatosemj/aurenOFC(?:\.git)?$') {
              throw 'Origin diferente de Yamatosemj/aurenOFC.'
            }
            $dirty = & git.exe -C $folder status --porcelain --untracked-files=no
            if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel verificar a arvore local.' }
            if ($dirty) { throw 'Alteracoes locais presentes; nada foi sobrescrito.' }
            $before = (& git.exe -C $folder rev-parse HEAD | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Nao consegui identificar HEAD antes.' }
            & git.exe -C $folder -c credential.interactive=never pull --ff-only origin main
            if ($LASTEXITCODE -ne 0) { throw 'git pull falhou ou exigiria merge. Nenhum reset aplicado.' }
            $after = (& git.exe -C $folder rev-parse HEAD | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Atualizacao executada mas HEAD final nao confirmado.' }
            $message = if ($before -eq $after) { 'Ja estava atualizado' } else { 'Atualizacao concluida' }
            "### Auren PC: $message" | Out-File -LiteralPath $summary -Encoding utf8 -Append
            "De $before para $after" | Out-File -LiteralPath $summary -Encoding utf8 -Append
            Write-Output "$message: $before -> $after"
          } catch {
            '### Atualizacao no PC falhou' | Out-File -LiteralPath $summary -Encoding utf8 -Append
            $_.Exception.Message | Out-File -LiteralPath $summary -Encoding utf8 -Append
            throw
          }
      - name: Testar PR sob watchdog de codigo revisado
        if: ${{ inputs.operacao == 'testar_pr' }}
        env:
          TEST_LAYER: ${{ inputs.camada }}
          PR_SHA: ${{ needs.validar.outputs.pr_sha }}
          PR_NUMBER: ${{ needs.validar.outputs.pr_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:USERPROFILE 'auren-remote\venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw 'Python isolado nao instalado.' }
          $trusted = Join-Path $env:GITHUB_WORKSPACE 'control\remote_tests\pr_job.py'
          $project = Join-Path $env:GITHUB_WORKSPACE 'pr-checkout'
          $reports = Join-Path $env:GITHUB_WORKSPACE 'reports'
          if (-not (Test-Path -LiteralPath $trusted)) { throw 'Controlador confiavel nao encontrado.' }
          $actual = (& git.exe -C $project rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:PR_SHA) {
            throw 'O checkout da PR nao corresponde ao SHA validado.'
          }
          if (-not $env:OPENAI_API_KEY) {
            $env:OPENAI_API_KEY = [Environment]::GetEnvironmentVariable('OPENAI_API_KEY', 'User')
          }
          if ($env:OPENAI_API_KEY) { Write-Output "::add-mask::$env:OPENAI_API_KEY" }
          & $python $trusted --project $project --output $reports --camada $env:TEST_LAYER
          $code = $LASTEXITCODE
          "### PR #$env:PR_NUMBER no Windows" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Commit testado: $env:PR_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if (Test-Path -LiteralPath (Join-Path $reports 'pr-result.json')) {
            Get-Content (Join-Path $reports 'pr-result.json') | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          exit $code
      - name: Publicar resultados da PR
        if: ${{ always() && inputs.operacao == 'testar_pr' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auren-pr-${{ needs.validar.outputs.pr_number }}-${{ github.run_id }}
          path: |
            reports/pr-result.json
            reports/pr-test.log
            reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7
