name: Auren V47 full tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ruff==0.13.2 mypy==1.18.2
      - run: ruff check core memory tools voice --select E9,F63,F7,F82
      - run: python -m mypy core/tool_result.py core/tool_contracts.py --ignore-missing-imports --follow-imports=skip

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest==9.1.1 numpy==2.5.3
      - run: python -m playwright install chromium
      - run: python -m pytest -q


  pytest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest==9.1.1 numpy==2.5.3
      - run: python -m playwright install chromium
      - run: python -m pytest -q
