name: Auren V47 visual interaction tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - run: python -m pytest -q tests/test_router_tool_selection.py tests/test_vision_input.py tests/test_tool_contracts.py tests/test_dispatcher_contracts.py tests/test_capability_registry.py tests/test_visual_input.py tests/test_prompt_injection.py tests/test_confirmation.py tests/test_visual_coordinate_dispatcher_integration.py tests/test_windows_clipboard.py tests/test_desktop_ui_backend.py tests/test_scripts_layout.py

  focused-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_router_tool_selection.py tests/test_vision_input.py tests/test_tool_contracts.py tests/test_dispatcher_contracts.py tests/test_capability_registry.py tests/test_visual_input.py tests/test_prompt_injection.py tests/test_confirmation.py tests/test_visual_coordinate_dispatcher_integration.py tests/test_windows_clipboard.py tests/test_desktop_ui_backend.py tests/test_scripts_layout.py
