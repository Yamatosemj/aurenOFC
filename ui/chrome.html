 const U={uThorn:{value:0},uTremor:{value:0},uDark:{value:0},uTime:{value:0},uAmp:{value:0},uFreq:{value:3},uSpeed:{value:1},uSpike:{value:0},uVoice:{value:0},
  uC1:{value:new THREE.Color()},uC2:{value:new THREE.Color()},uAlpha:{value:1},uGlow:{value:.5}};
 const root=new THREE.Group();scene.add(root);
 const orb=new THREE.Mesh(new THREE.IcosahedronGeometry(1,28),new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS,transparent:true}));
 root.add(orb);
 const glowU={uC:{value:U.uC1.value},uA:{value:0}};
 const glow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShaderMaterial({uniforms:glowU,vertexShader:GV,fragmentShader:GF,transparent:true,depthWrite:false}));
 glow.position.z=-1.2;root.add(glow);
 const ringG=new THREE.Group();ringG.rotation.x=-1.15;root.add(ringG);
 const rings=[0,1,2].map(()=>{const m=new THREE.Mesh(new THREE.RingGeometry(.985,1,128),new THREE.MeshBasicMaterial({transparent:true,side:THREE.DoubleSide,depthWrite:false}));ringG.add(m);return m});
 const orbG=new THREE.Group();orbG.rotation.x=.55;root.add(orbG);
 const dots=[0,1,2].map(()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.07,16,16),new THREE.MeshBasicMaterial({transparent:true}));orbG.add(m);return m});
 const NP=380,pp=new Float32Array(NP*3),pv=new Float32Array(NP);
 const reset=(i,r)=>{const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);pp[i*3]=r*Math.sin(b)*Math.cos(a);pp[i*3+1]=r*Math.cos(b);pp[i*3+2]=r*Math.sin(b)*Math.sin(a)};
 for(let i=0;i<NP;i++){reset(i,1.5+Math.random()*4.5);pv[i]=.3+Math.random()*.7}
 const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pp,3));
 const pm=new THREE.PointsMaterial({size:.05,transparent:true,depthWrite:false});root.add(new THREE.Points(pg,pm));
 const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,2),new THREE.MeshBasicMaterial({wireframe:true,transparent:true,depthWrite:false}));root.add(shell);
 const gyros=[[1.2,.3,0],[.4,1.1,.5],[.9,-.6,1.2]].map(r=>{const m=new THREE.Mesh(new THREE.TorusGeometry(1.7,.008,8,180),new THREE.MeshBasicMaterial({transparent:true}));m.rotation.set(r[0],r[1],r[2]);root.add(m);return m});
 function ajusta(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.position.z=5.4*Math.max(1,.85/cam.aspect);cam.updateProjectionMatrix()}
 addEventListener("resize",ajusta);ajusta();
 let px=0,py=0;
 addEventListener("pointermove",e=>{px=e.clientX/innerWidth*2-1;py=e.clientY/innerHeight*2-1});
 const c1=new THREE.Color(),c2=new THREE.Color();
 let t=0,ph=0,ult=performance.now();
 function frame(now){
  const dt=Math.min(.05,(now-ult)/1000);ult=now;t+=dt*(reduz?.4:1);ph+=dt*cur.pf;
  if(from){const p=Math.min(1,Math.max(0,(now-tI)/tD));
   for(const k in alvo){if(typeof alvo[k]!=="number")continue;
    const dl=LAG[k]||0,q=Math.min(1,Math.max(0,(p-dl)/(1-dl))),e=q*q*q*(q*(q*6-15)+10);
    if(k==="hue")cur.hue=from.hue+(((alvo.hue-from.hue+540)%360)-180)*e;else cur[k]=from[k]+(alvo[k]-from[k])*e}
   if(p>=1){if(fila.length)inicia(fila.shift());else from=null}}
  const h=((cur.hue%360)+360)%360/360,s=cur.sat/100,l=cur.lig/100;
  c1.setHSL(h,s,l);c2.setHSL(((h+cur.hs)%1+1)%1,s,Math.min(.9,l+.12));
  U.uC1.value.copy(c1);U.uC2.value.copy(c2);
  const voz=cur.voice*(.5+.5*Math.sin(t*7.3))*(.55+.45*Math.sin(t*2.7+1));
  U.uTime.value=t;U.uAmp.value=cur.amp*(reduz?.5:1);U.uFreq.value=cur.lobes*.7+.8;
  U.uSpeed.value=cur.speed;U.uSpike.value=cur.spike;U.uThorn.value=cur.thorn;U.uTremor.value=cur.tremor*(reduz?.3:1);U.uDark.value=cur.dark;U.uVoice.value=voz;U.uAlpha.value=cur.alpha;U.uGlow.value=cur.glow;
  const sc=cur.scale*(1+cur.pulse*.07*Math.sin(ph));
  root.position.set(cur.shake*.025*Math.sin(t*47),.25-cur.down+cur.bounce*Math.abs(Math.sin(t*3))*.14+cur.shake*.025*Math.cos(t*39),0);
  root.rotation.y+=((px*.35)-root.rotation.y)*.05;root.rotation.x+=((py*.2)-root.rotation.x)*.05;
  orb.scale.set(sc,sc*cur.squash,sc);orb.rotation.y+=dt*.2;
  glow.scale.setScalar(sc*5.2);glowU.uA.value=cur.glow*cur.alpha;
  ringG.visible=cur.ring>.02;
  rings.forEach((m,i)=>{const p=(t*.45+i/3)%1;m.scale.setScalar(sc*(1.1+p*1.1));m.material.opacity=(1-p)*.55*cur.ring;m.material.color.copy(c2)});
  orbG.visible=cur.orbit>.02;
  dots.forEach((m,i)=>{const a=t*1.8+i*2.094;m.position.set(Math.cos(a)*1.55*sc,0,Math.sin(a)*1.55*sc);m.material.opacity=.9*cur.orbit;m.material.color.copy(c2)});
  for(let i=0;i<NP;i++){const k=pv[i],a=cur.swirl*dt*k,c=Math.cos(a),n=Math.sin(a),f=1+cur.flow*dt*.5*k;
   let x=pp[i*3],y=pp[i*3+1],z=pp[i*3+2];
   const nx=(x*c-z*n)*f,nz=(x*n+z*c)*f;y=y*f+cur.rise*dt*.7*k;
   x=nx+(Math.random()-.5)*cur.tremor*dt*2;z=nz+(Math.random()-.5)*cur.tremor*dt*2;
   const L=Math.hypot(x,y,z);
   if(L>6.5||L<1.3||Math.abs(y)>4){reset(i,cur.flow<0?5.8:1.5+Math.random()*1.5);continue}
   pp[i*3]=x;pp[i*3+1]=y;pp[i*3+2]=z}
  pg.attributes.position.needsUpdate=true;
  pm.color.copy(c2);pm.opacity=(.35+cur.glow*.4)*(.4+.6*Math.min(1,cur.scale));
  shell.scale.setScalar(sc);shell.rotation.y-=dt*(.15+cur.swirl*.3);shell.rotation.x+=dt*.07;
  shell.material.color.copy(c2);shell.material.opacity=(.1+cur.dark*.22+cur.glow*.06)*cur.alpha;
  gyros.forEach((g,i)=>{g.scale.setScalar(sc);g.rotation.y+=dt*(.25+cur.swirl*.7)*(i%2?-1:1);g.rotation.z+=dt*.1*(i+1);
   g.material.color.copy(c2);g.material.opacity=(.22+cur.dark*.3)*cur.alpha});
  document.documentElement.style.setProperty("--tint","hsla("+Math.round(h*360)+","+Math.round(cur.sat)+"%,"+Math.round(cur.lig)+"%,"+((.1+cur.glow*.16+cur.dark*.22)*cur.alpha).toFixed(3)+")");
  R.render(scene,cam);requestAnimationFrame(frame);
 }
 define("fundo");requestAnimationFrame(frame);
 }catch(e){
  const erro="Não foi possível iniciar o orbe 3D. Verifique se a aceleração de hardware/WebGL está ativada no Chrome.";
  lab.textContent=erro;
  cap.textContent=erro;

}

/* Ponte HTTP local. Não há ações simuladas nem endpoint genérico de tools. */
const AUREN_TOKEN="__AUREN_LOCAL_TOKEN__";
let modoAtual="off",ocupado=false,ultimoEvento=0,consultando=false,pedidoPendente=null;
async function postApi(path,body){
 const res=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Auren-Token":AUREN_TOKEN},body:JSON.stringify(body),cache:"no-store"});
 const data=await res.json();
 if(!res.ok)throw new Error(data.error||"Falha na comunicação local");
 return data;
}
function pintaModo(){
 const bot=$("bEstados");
 bot.textContent=({off:"Desligado",standby:"Standby",active:"Ativo"})[modoAtual]||"Auren";
 if(modoAtual==="off"){
  seq++;clearTimeout(idle);pedidoPendente=null;$("authPanel").hidden=true;
  define("fundo");cap.textContent="Auren desligado. Envie uma mensagem para iniciar.";
 }else if(modoAtual==="standby"){
  seq++;clearTimeout(idle);
  define("fundo");cap.textContent="Em standby. Envie uma mensagem para continuar.";
 }else if(!ocupado&&!cap.textContent.trim()){
  define("normal");cap.textContent="Pronto para conversar.";
 }
}
async function responderConfirmacao(aprovado){
 const pendente=pedidoPendente;if(!pendente)return;
 pedidoPendente=null;$("authPanel").hidden=true;
 try{await postApi("/api/confirm",{id:pendente.id,approved:aprovado});define("pensando")}
 catch(err){cap.textContent=err.message}
}
$("authNo").onclick=()=>responderConfirmacao(false);
$("authYes").onclick=()=>responderConfirmacao(true);
function evento(e){
 if(e.kind==="you"){eco.textContent="Você: "+e.text;cap.textContent="";define("pensando")}
 else if(e.kind==="busy"){ocupado=true;if(modoAtual==="active")define("pensando")}
 else if(e.kind==="idle"){ocupado=false}
 else if(e.kind==="reply"&&modoAtual!=="off"){void agir("normal",e.text)}
 else if(e.kind==="error"&&modoAtual!=="off"){void agir("confusa",e.text)}
 else if(e.kind==="confirm"){
  pedidoPendente=e.payload;
  $("authAction").textContent=e.payload.action;
  $("authReason").textContent=e.payload.reason;
  $("authPanel").hidden=false;define("perguntando");
 }
 else if(e.kind==="confirm_done"){pedidoPendente=null;$("authPanel").hidden=true}
 else if(e.kind==="off"){if(modoAtual==="off")pintaModo()}
}
// Avisos sobrevivem a recarregamentos ate que a propria interface confirme
// que exibiu o cartao. O ACK nao conclui nem cancela o lembrete.
const avisosExibidos=new Set(),avisosAckEmAndamento=new Set();
function mostrarAviso(reminder){
 const id=reminder&&reminder.id;
 if(!Number.isSafeInteger(id)||id<1)return;
 if(!avisosExibidos.has(id)){
  avisosExibidos.add(id);
  const title=String(reminder.texto||"Lembrete");
  addCard({tipo:"lembrete",titulo:title,meta:"Hora de lembrar",id});
  seq++;define("lembrete");cap.textContent="Lembrete: "+title;
  document.title="🔔 Lembrete • Auren";
  if("Notification" in window&&Notification.permission==="granted"){
   try{new Notification("Lembrete do Auren",{body:title})}catch(err){console.warn("Notificação indisponível",err)}
  }
 }
 if(!avisosAckEmAndamento.has(id)){
  avisosAckEmAndamento.add(id);
  void postApi("/api/reminders/ack",{id}).catch(err=>{
   console.warn("Confirmacao do aviso pendente de nova tentativa",err);
  }).finally(()=>avisosAckEmAndamento.delete(id));
 }
}
async function eventos(){
 if(consultando)return;consultando=true;
 try{
  const r=await fetch("/api/events?after="+ultimoEvento,{headers:{"X-Auren-Token":AUREN_TOKEN},cache:"no-store"});
  if(!r.ok)throw new Error("Serviço local indisponível");
  const d=await r.json();
  const previous=modoAtual;modoAtual=d.mode;ocupado=d.busy;
  for(const e of d.events){evento(e);ultimoEvento=Math.max(ultimoEvento,e.seq)}
  if(d.gap)cap.textContent="Alguns eventos antigos não estão disponíveis. Confira o estado atual.";
  if(previous!==modoAtual)pintaModo();
  if(d.events.length&&modoAtual==="off")pintaModo();
  // Renderizar por ultimo evita que o modo Desligado apague o aviso.
  for(const reminder of (d.alerts||[]))mostrarAviso(reminder);
  $("connection").textContent="Auren local • "+(ocupado?"processando":modoAtual);
 }catch(err){$("connection").textContent="Sem conexão com o Auren local."}
 finally{consultando=false}
}
const connection=document.createElement("div");connection.id="connection";$("stage").append(connection);
pintaModo();eventos();setInterval(eventos,450);
</script>
