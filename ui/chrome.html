 ctx.beginPath();for(let i=0;i<=sides;i++){
  const a=i*2*Math.PI/sides,x=Math.cos(a)*rad,y=Math.sin(a)*rad;
  if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }ctx.stroke();
 for(let i=0;i<sides;i++){
  const a=i*2*Math.PI/sides,b=((i+5)%sides)*2*Math.PI/sides;
  ctx.beginPath();ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);
  ctx.lineTo(Math.cos(b)*rad,Math.sin(b)*rad);ctx.stroke();
 }ctx.restore();
 const bubble=ctx.createRadialGradient(cx-radius*.30,cy-radius*.43,radius*.03,cx,cy,radius*1.05);
 bubble.addColorStop(0,"hsla("+hue+",90%,92%,"+cur.alpha+")");
 bubble.addColorStop(.22,"hsla("+hue+",65%,79%,"+cur.alpha+")");
 bubble.addColorStop(.64,"hsla("+(hue+14)+",40%,61%,"+cur.alpha+")");
 bubble.addColorStop(1,"hsla("+(hue+17)+",45%,38%,"+cur.alpha+")");
 ctx.fillStyle=bubble;circ(cx,cy,radius);ctx.fill();
 ctx.lineWidth=2;ctx.strokeStyle="hsla("+hue+",85%,88%,"+(cur.alpha*.50)+")";ctx.stroke();
 ctx.save();ctx.translate(cx-radius*.20,cy-radius*.23);ctx.rotate(-.55);
 const shine=ctx.createRadialGradient(0,0,0,0,0,radius*.47);
 shine.addColorStop(0,"rgba(255,255,255,.6)");
 shine.addColorStop(1,"rgba(255,255,255,0)");
 ctx.fillStyle=shine;ctx.beginPath();ctx.ellipse(0,0,radius*.35,radius*.16,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
 document.documentElement.style.setProperty("--tint","hsla("+hue+",65%,52%,"+(.08+cur.glow*.13)+")");
}
define("fundo");requestAnimationFrame(desenhar);

/* Ponte HTTP local. Não há ações simuladas nem endpoint genérico de tools. */
const AUREN_TOKEN="__AUREN_LOCAL_TOKEN__";
let modoAtual="off",ocupado=false,ultimoEvento=0,consultando=false,pedidoPendente=null;
async function postApi(path,body){
 const res=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Auren-Token":AUREN_TOKEN},body:JSON.stringify(body),cache:"no-store"});
 const data=await res.json();
 if(!res.ok)throw new Error(data.error||"Falha na comunicação local");
 return data;
}
function pintaModo(){
 const bot=$("bEstados");bot.textContent=({off:"Desligado",standby:"Standby",active:"Ativo"})[modoAtual]||"Estados";
 document.querySelectorAll("#estados .chip").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.mode===modoAtual)));
 if(modoAtual==="off"){define("fundo");if(!ocupado)cap.textContent="Auren desligado. Clique em Desligado para ativar."}
 if(modoAtual==="standby"){define("fundo");cap.textContent="Standby: novas mensagens pausadas."}
 if(modoAtual==="active"&&!ocupado&&!cap.textContent.trim()){define("normal");cap.textContent="Pronto para conversar."}
}
async function trocarModo(novo){
 try{
  const r=await postApi("/api/mode",{mode:novo});modoAtual=r.mode;painel.hidden=true;
  pintaModo();if(novo==="active"){define("normal");cap.textContent="Pronto para conversar."}
  if(novo==="off"){pedidoPendente=null;$("authPanel").hidden=true}
 }catch(err){cap.textContent=err.message}
}
async function responderConfirmacao(aprovado){
 const pendente=pedidoPendente;if(!pendente)return;
 pedidoPendente=null;$("authPanel").hidden=true;
 try{await postApi("/api/confirm",{id:pendente.id,approved:aprovado});define("pensando")}
 catch(err){cap.textContent=err.message}
}
$("authNo").onclick=()=>responderConfirmacao(false);
$("authYes").onclick=()=>responderConfirmacao(true);
function evento(e){
 if(e.kind==="you"){eco.textContent="Você: "+e.text;cap.textContent="";define("pensando")}
 else if(e.kind==="busy"){ocupado=true;if(modoAtual==="active")define("pensando")}
 else if(e.kind==="idle"){ocupado=false}
 else if(e.kind==="reply"&&modoAtual!=="off"){void agir("normal",e.text)}
 else if(e.kind==="error"&&modoAtual!=="off"){void agir("confusa",e.text)}
 else if(e.kind==="confirm"){
  pedidoPendente=e.payload;
  $("authAction").textContent=e.payload.action;
  $("authReason").textContent=e.payload.reason;
  $("authPanel").hidden=false;define("perguntando");
 }
 else if(e.kind==="confirm_done"){pedidoPendente=null;$("authPanel").hidden=true}
 else if(e.kind==="off"){if(modoAtual==="off")pintaModo()}
}
async function eventos(){
 if(consultando)return;consultando=true;
 try{
  const r=await fetch("/api/events?after="+ultimoEvento,{headers:{"X-Auren-Token":AUREN_TOKEN},cache:"no-store"});
  if(!r.ok)throw new Error("Serviço local indisponível");
  const d=await r.json();
  const previous=modoAtual;modoAtual=d.mode;ocupado=d.busy;
  for(const e of d.events){evento(e);ultimoEvento=Math.max(ultimoEvento,e.seq)}
  if(d.gap)cap.textContent="Alguns eventos antigos não estão disponíveis. Confira o estado atual.";
  if(!d.events.length&&previous!==modoAtual)pintaModo();
  if(d.events.length&&!d.events.some(e=>e.kind==="reply"||e.kind==="error")&&modoAtual==="off")pintaModo();
  $("connection").textContent="Auren local • "+(ocupado?"processando":modoAtual);
 }catch(err){$("connection").textContent="Sem conexão com o Auren local."}
 finally{consultando=false}
}
const connection=document.createElement("div");connection.id="connection";$("stage").append(connection);
pintaModo();eventos();setInterval(eventos,450);
</script>
